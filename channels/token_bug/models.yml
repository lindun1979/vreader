# 模型系列表 v2（series-norm）。每个系列只记「身份模板 + 系列名糊法 + 昵称 + 变体」，
# 版本号不写死在别名里——靠代码对转写/标题做「提及锚定」从源文本数字拼合（GRM5.3、
# step3.7 flash 等新版本无需改表）。
#
# 字段：
#   format            冻结的身份模板，{v} 处填版本号；canonical = format.format(v=版本)
#                     + (" "+variant if variant)。改 format = 显式迁移事件，勿顺手改。
#   version_letter    （可选）版本号前的格式字母（DeepSeek V4 的 V、Kimi K3 的 K），
#                     锚定扫描时允许出现在系列名与数字之间（deepseekv4 / kimi k3）。
#   aliases           系列名糊法（不带版本、不带变体）。锚定：alias + 邻接数字 → 版本锚点。
#   nicknames         系列级动态昵称（只绑系列，永不携带版本；如「一哥」随期变版本）。
#   variants          该系列允许的变体清单；每个变体可有 aliases（变体词形）与 nicknames
#                     （变体级昵称，绑 系列+变体，仍不绑版本）。未在此清单的 variant → UNKNOWN。
#   version_map       （可选）原始提及数字 → 归一版本（Opus 4.8/5.0 都归 "5"）。
#   seed_versions     一次性兼容基线：基础款（无变体）的已知版本，入 known_versions(source=seed)。
#   seed_variant_versions  变体款的已知版本 {变体名: [版本...]}。
# 上线后新增版本一律走 vr确认（confirm），不再回写 seed 字段。

GLM:
  format: "GLM-{v}"
  aliases: [glm, grm, gm, 智谱, 智普]
  nicknames: [一哥, 国模一哥]
  variants:
    Flash:
      aliases: [flash]
      nicknames: [小一哥]
  seed_versions: ["5.2", "5.3"]
  seed_variant_versions: {Flash: ["5.3"]}

